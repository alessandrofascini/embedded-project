[platformio]
src_dir = .
include_dir = .
test_dir = Core/Test
default_envs = release

[env:release]
platform = ststm32
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200

board = nucleo_c031c6
board_build.ldscript = STM32C031xx_FLASH.ld
; Keep our own customized Core/Inc/stm32c0xx_hal_conf.h instead of letting
; the framework overwrite it with the stock template.
board_build.stm32cube.custom_config_header = yes

build_flags =
    -std=gnu23
    -D_XOPEN_SOURCE
    -DUSE_HAL_DRIVER
    -ICore/Inc
    -ICore/Inc/recruiting
    -ICore/Inc/recruiting/module_name
    -ICore/Inc/recruiting/temperature

; CMSIS/HAL sources now come from the stm32cube framework package itself,
; so our vendored Drivers/ tree is excluded here to avoid duplicate symbols.
build_src_filter =
    +<Core/Src/>

lib_deps =
    https://github.com/eagletrt/libtimebase-sw
    https://github.com/eagletrt/libfsm-sw

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
    clangtidy: --extra-arg=-std=gnu23
    clangtidy: --extra-arg=-U__cplusplus
check_src_filters =
    -<**>
    +<Core/Src/recruiting>
    ; Add here the directories you want to check with clang-tidy

[env:tests]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu23
    -DEAGLETRT_STATIC=
    -lm ;link math.h
    -D_XOPEN_SOURCE
    -ICore/Inc/recruiting/module_name
    -ICore/Inc/recruiting/temperature
    -ICore/Test/include

build_src_filter =
    +<Core/Src/recruiting/temperature/>
    +<Core/Src/recruiting/module_name/>

lib_deps =
    https://github.com/eagletrt/libtimebase-sw
    https://github.com/eagletrt/libfsm-sw